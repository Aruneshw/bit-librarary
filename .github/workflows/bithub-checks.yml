name: BIT HUB checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --experimental-strip-types --test frontend/tests/*.test.mjs
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_HUB_DEMO_ENABLED: 'false'
          SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder-not-a-credential
      - run: npm ci && npm run build
        working-directory: backend
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: bithub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: bithub_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f database/tests/hub-bootstrap.sql
      - run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f database/tests/hub-integration.sql -f database/tests/hub-review.sql -f database/tests/hub-admin-access.sql -f database/tests/hub-bubble-presence.sql -f database/tests/hub-admin-surveillance.sql
      - run: psql -v ON_ERROR_STOP=1 -f database/neon_projects.sql -f database/tests/neon-projects.sql
