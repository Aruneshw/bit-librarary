worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # OS Limits & Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Caching Setup
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;
    
    # Load Balancer Upstreams
    upstream nextjs_frontend {
        server 127.0.0.1:3000;
        # Add more servers here for horizontal scaling
    }

    upstream express_backend {
        server 127.0.0.1:5000; # Assuming backend runs on 5000
    }

    server {
        listen 80;
        server_name localhost;

        # Protect against slowloris and limit connections
        client_body_timeout 10s;
        client_header_timeout 10s;
        limit_conn conn_limit 20;

        # Route API to Express Backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # API Cache TTL (e.g. 1 minute)
            proxy_cache STATIC;
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Route everything else to Next.js Frontend
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Next.js handles its own caching, but we can cache static assets
            location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|riv)$ {
                proxy_pass http://nextjs_frontend;
                proxy_cache STATIC;
                proxy_cache_valid 200 1d; # 1 Day TTL for static assets
                add_header Cache-Control "public, max-age=86400, immutable";
                add_header X-Cache-Status $upstream_cache_status;
            }
        }
    }
}
